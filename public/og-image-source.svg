<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!--
    DecisiGraph Open Graph Social Preview Vector Source (1200x630)
    Sesuai Technical Spec Addendum-2 (§21.5).
    File ini berfungsi sebagai master asset vektor. Untuk production,
    file ini dapat dikonversi ke raster image (PNG) dan disimpan sebagai public/og.png atau public/og-image.png.
  -->
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#0B0F19" />
      <stop offset="50%" stopColor="#111827" />
      <stop offset="100%" stopColor="#0F172A" />
    </linearGradient>

    <radialGradient id="glow-indigo" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stopColor="#4F46E5" stopOpacity="0.25" />
      <stop offset="100%" stopColor="#4F46E5" stopOpacity="0" />
    </radialGradient>

    <radialGradient id="glow-violet" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stopColor="#8B5CF6" stopOpacity="0.2" />
      <stop offset="100%" stopColor="#8B5CF6" stopOpacity="0" />
    </radialGradient>

    <!-- Logo Brand Gradients -->
    <linearGradient id="logo-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#4F46E5" />
      <stop offset="100%" stopColor="#8B5CF6" />
    </linearGradient>

    <linearGradient id="logo-node" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FFFFFF" />
      <stop offset="100%" stopColor="#EDE9FE" />
    </linearGradient>

    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#6366F1" />
      <stop offset="100%" stopColor="#A855F7" />
    </linearGradient>

    <!-- Subtle Dot Grid Pattern -->
    <pattern id="dot-grid" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#334155" fill-opacity="0.25" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bg-grad)" />
  <rect width="1200" height="630" fill="url(#dot-grid)" />
  <rect width="1200" height="630" fill="url(#glow-indigo)" />
  <rect width="1200" height="630" fill="url(#glow-violet)" />

  <!-- Outer Border Frame -->
  <rect x="24" y="24" width="1152" height="582" rx="28" stroke="#334155" stroke-opacity="0.4" stroke-width="1.5" />

  <!-- Header Badge: MCDM Framework -->
  <g transform="translate(100, 100)">
    <rect width="320" height="40" rx="20" fill="#1E293B" fill-opacity="0.8" stroke="#3730A3" stroke-width="1.2" />
    <circle cx="22" cy="20" r="5" fill="#4F46E5" />
    <text x="36" y="25" fill="#A5B4FC" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" letter-spacing="0.5">
      MCDM • SPK INTERACTIVE STUDIO
    </text>
  </g>

  <!-- Brand Title Section (Logo Mark + Wordmark) -->
  <g transform="translate(100, 170)">
    <!-- Logo Squircle (110x110) -->
    <g transform="translate(0, 0)">
      <rect width="110" height="110" rx="26" fill="url(#logo-bg)" />
      <!-- Inner Branch Lines -->
      <path d="M55 28L28 82M55 28L82 82M28 82H82" stroke="white" stroke-opacity="0.45" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
      <!-- Nodes -->
      <circle cx="55" cy="28" r="12" fill="url(#logo-node)" />
      <circle cx="28" cy="82" r="10" fill="url(#logo-node)" />
      <circle cx="82" cy="82" r="10" fill="url(#logo-node)" />
      <!-- Inner Node Accent -->
      <circle cx="55" cy="28" r="5" fill="#4F46E5" />
      <circle cx="28" cy="82" r="4" fill="#4F46E5" />
      <circle cx="82" cy="82" r="4" fill="#4F46E5" />
    </g>

    <!-- Wordmark -->
    <text x="140" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="76" font-weight="800" letter-spacing="-1">
      <tspan fill="#F8FAFC">Decisi</tspan><tspan fill="url(#text-grad)">Graph</tspan>
    </text>
  </g>

  <!-- Tagline -->
  <g transform="translate(100, 340)">
    <text x="0" y="0" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="700" letter-spacing="-0.5">
      Kalkulator &amp; Studio Interaktif SPK
    </text>
    <text x="0" y="44" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="400">
      Visualisasi rumus step-by-step, jejak kalkulasi transparan, dan perbandingan konsensus MCDM.
    </text>
  </g>

  <!-- Method & Feature Badges -->
  <g transform="translate(100, 460)">
    <!-- SAW Pill -->
    <g transform="translate(0, 0)">
      <rect width="105" height="48" rx="14" fill="#1E293B" stroke="#334155" stroke-width="1.2" />
      <text x="52" y="30" fill="#F1F5F9" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" text-anchor="middle">SAW</text>
    </g>

    <!-- WP Pill -->
    <g transform="translate(120, 0)">
      <rect width="105" height="48" rx="14" fill="#1E293B" stroke="#334155" stroke-width="1.2" />
      <text x="52" y="30" fill="#F1F5F9" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" text-anchor="middle">WP</text>
    </g>

    <!-- TOPSIS Pill -->
    <g transform="translate(240, 0)">
      <rect width="125" height="48" rx="14" fill="#1E293B" stroke="#334155" stroke-width="1.2" />
      <text x="62" y="30" fill="#F1F5F9" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" text-anchor="middle">TOPSIS</text>
    </g>

    <!-- AHP Pill -->
    <g transform="translate(380, 0)">
      <rect width="105" height="48" rx="14" fill="#1E293B" stroke="#334155" stroke-width="1.2" />
      <text x="52" y="30" fill="#F1F5F9" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" text-anchor="middle">AHP</text>
    </g>

    <!-- Feature: Traceable Cell -->
    <g transform="translate(510, 0)">
      <rect width="210" height="48" rx="14" fill="#1E1B4B" stroke="#4F46E5" stroke-width="1.2" />
      <circle cx="24" cy="24" r="5" fill="#6366F1" />
      <text x="38" y="29" fill="#C7D2FE" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600">Traceable Cells</text>
    </g>

    <!-- Feature: Story-to-Matrix -->
    <g transform="translate(735, 0)">
      <rect width="215" height="48" rx="14" fill="#2E1065" stroke="#7C3AED" stroke-width="1.2" />
      <circle cx="24" cy="24" r="5" fill="#A855F7" />
      <text x="38" y="29" fill="#DDD6FE" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600">Story-to-Matrix</text>
    </g>
  </g>

  <!-- Bottom Meta Info -->
  <g transform="translate(100, 565)">
    <text x="0" y="0" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500">
      decisigraph.hafidzrdwn.dev • Free, Open-Source &amp; Client-Side
    </text>
  </g>
</svg>
